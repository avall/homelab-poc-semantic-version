version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"       # also used for the PR title
    labels:
      - dependencies              # pr-title skips validation for this label
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
