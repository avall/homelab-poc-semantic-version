name: hotfix-release
on:
  # pull_request_target: since 2025-12-08 this file always comes from the default branch, so lines cut from
  # tags older than this workflow still release. The merged code is checked out by merge_commit_sha and was reviewed.
  pull_request_target:
    types: [closed]
    branches: ['hotfix/**']
permissions:
  contents: read
concurrency:
  group: hotfix-release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false       # each merge gets its own hotfix.N, in order
jobs:
  hotfix-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write             # tag + GitHub Release
      pull-requests: read
    env:
      TITLE: ${{ github.event.pull_request.title }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Title type must be fix, perf or revert
        run: |
          re='^(fix|perf|revert)(\([^)]*\))?: '
          [[ "$TITLE" =~ $re ]] || { echo "::error::$BASE_REF releases only fix, perf or revert. Got: $TITLE"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0          # all tags
          persist-credentials: false   # the build below never gets the write token
      - name: Release scripts from the default branch (old production tags may predate them)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: Version
        id: v
        run: |
          base="${BASE_REF#hotfix/}"
          version=$(git tag -l | .release-tools/scripts/hotfix-version.sh next "$base")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Hotfix version $version on line $BASE_REF"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Stamp version and build
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          ./mvnw -B verify
      - name: Container image names (no docker build in the POC)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          echo "IMAGE ghcr.io/avall/homelab-poc-semantic-version:$VERSION-oci"
          echo "IMAGE ghcr.io/avall/homelab-poc-semantic-version:$VERSION"
      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
          BASE: ${{ steps.v.outputs.base }}
        run: |
          # gh release create reuses an existing tag: refuse instead of overwriting
          if gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --silent 2>/dev/null; then
            echo "::error::Tag $VERSION already exists"; exit 1
          fi
          gh release create "$VERSION" --target "$SHA" --title "$VERSION" --latest=false \
            --notes "Hotfix on production $BASE (line hotfix/$BASE). Cumulative: includes every earlier hotfix of this line. PR #$PR_NUMBER: $TITLE"
      - name: Summary
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          tee -a "$GITHUB_STEP_SUMMARY" <<EOF
          ## Released $VERSION on $BASE_REF

          - Images: \`ghcr.io/avall/homelab-poc-semantic-version:$VERSION-oci\`, \`ghcr.io/avall/homelab-poc-semantic-version:$VERSION\`
          - GitHub Release not marked Pre-release and not Latest
          - PR #$PR_NUMBER: $TITLE
          EOF
