name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the release instead of creating the tag and GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/avall/homelab-poc-semantic-version
  ARTIFACTS: com.avall.poc:hello-lib, com.avall.poc:hello-service

jobs:
  semantic-release:
    name: Semantic release (version, build, tag and GitHub Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # semantic-release verifies push access even in dry-run mode, and creates the tag and GitHub Release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate next version (semantic-release dry run)
        id: version
        uses: ./.github/actions/semantic-version
        with:
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Validate version
        if: steps.version.outputs.published == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-hotfix\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release version '$RELEASE_VERSION'"
            exit 1
          fi

      # Nexus deploy disabled: the Nexus started by docker compose does not work yet. To enable it, uncomment this
      # step and remove `goal: install` below.
      # - name: Start Nexus (docker compose)
      #   if: steps.version.outputs.published == 'true'
      #   env:
      #     # Accepts the Sonatype Nexus Community Edition EULA: https://links.sonatype.com/products/nxrm/ce-eula
      #     NEXUS_ACCEPT_EULA: 'true'
      #   run: .github/scripts/nexus-up.sh

      - name: Build and test release (Nexus deploy printed)
        if: steps.version.outputs.published == 'true'
        uses: ./.github/actions/maven-build
        with:
          version: ${{ steps.version.outputs.version }}
          goal: install
          deploy-repository: maven-releases

      - name: Build docker images (push printed)
        if: steps.version.outputs.published == 'true'
        uses: ./.github/actions/docker-image
        with:
          version: ${{ steps.version.outputs.version }}
          latest: ${{ steps.version.outputs.hotfix != 'true' }}

      - name: Create tag and GitHub Release (semantic-release)
        id: release
        if: steps.version.outputs.published == 'true'
        uses: ./.github/actions/github-release
        with:
          version: ${{ steps.version.outputs.version }}
          # Pushes the chore(release) pom.xml commit to the protected master: the token owner must be in the
          # master ruleset bypass list. [skip ci] in the commit avoids a new workflow run.
          github-token: ${{ secrets.PUSH_TO_PROTECTED_BRANCH }}
          dry-run: ${{ inputs.dry_run == true }}

      - name: Summary
        if: always() && steps.version.outputs.published == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          LAST_VERSION: ${{ steps.version.outputs.last-version }}
          HOTFIX: ${{ steps.version.outputs.hotfix }}
          TAG_RESULT: ${{ inputs.dry_run == true && 'dry run (not created)' || steps.release.outputs.published == 'true' && 'created' || 'not created' }}
        run: |
          tags="\`$IMAGE:$RELEASE_VERSION\`, \`$IMAGE:$RELEASE_VERSION-oci\`"
          if [[ "$HOTFIX" == "true" ]]; then
            hotfix=yes latest=no
          else
            hotfix=no latest=yes
            tags="$tags, \`$IMAGE:latest\`"
          fi
          {
            echo "### Release"
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Hotfix | $hotfix |"
            echo "| Last version | \`${LAST_VERSION:-none}\` |"
            echo "| Next version | \`$RELEASE_VERSION\` |"
            echo "| GitHub \"Latest\" expected | $latest |"
            echo "| Maven artifacts | $ARTIFACTS \`$RELEASE_VERSION\` (Nexus \`maven-releases\`) |"
            echo "| Docker tags | $tags (not pushed) |"
            echo "| Tag / GitHub Release | $TAG_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
