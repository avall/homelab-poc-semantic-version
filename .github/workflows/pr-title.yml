name: pr-title
on:
  pull_request_target:            # config read from the base branch; the PR is never checked out
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
permissions:
  pull-requests: read
jobs:
  pr-title:                       # check name "pr-title" is required by the branch ruleset
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            test
            refactor
            build
            ci
            chore
            style
          # Jira key first in the description
          subjectPattern: ^CK-\d+ .+$
          subjectPatternError: 'Use "<type>: CK-1234 <description>", e.g. "fix: CK-11533 handle null carrier id".'
          # Dependabot PRs: title prefix set by dependabot.yml, no Jira key
          ignoreLabels: |
            dependencies
      - name: Hotfix lines accept only fix, perf and revert
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          [[ "$BASE" == hotfix/* ]] || { echo "Base $BASE is not a hotfix line"; exit 0; }
          re='^(fix|perf|revert)(\([^)]*\))?: '   # no "!": a hotfix never breaks clients
          if [[ "$TITLE" =~ $re ]]; then
            echo "OK for $BASE: $TITLE"
          else
            echo "::error::$BASE accepts only fix, perf or revert titles without '!'. Got: $TITLE"
            exit 1
          fi
