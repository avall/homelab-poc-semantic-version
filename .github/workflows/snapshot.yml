name: snapshot
# Simulation of proposal §8 (single-module POC): no Nexus, the deploy and the delete are printed. Not a required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
concurrency:
  group: snapshot-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  publish:
    if: github.event.action != 'closed' && startsWith(github.head_ref, 'CK-')
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Stamp snapshot version and build
        run: |
          version=$(scripts/snapshot-version.sh "$HEAD_REF")
          ./mvnw -B versions:set -DnewVersion="$version" -DgenerateBackupPoms=false
          ./mvnw -B verify
          artifact=$(./mvnw -B -q help:evaluate -Dexpression=project.artifactId -DforceStdout)
          {
            echo "[simulated] mvn deploy -> Nexus snapshots: com.avall.poc:$artifact:$version"
            echo "No Docker image for snapshots"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  delete:
    if: github.event.action == 'closed' && startsWith(github.head_ref, 'CK-')
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}   # the merge ref of a closed PR may be gone
      - name: Delete snapshot version
        run: |
          version=$(scripts/snapshot-version.sh "$HEAD_REF")
          echo "[simulated] DELETE $version from Nexus snapshots" | tee -a "$GITHUB_STEP_SUMMARY"
